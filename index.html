<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PokéVendas — Cartas à venda nas últimas 24h</title>
  <meta name="description" content="Lista atualizada das vendas de cartas Pokémon anunciadas no grupo nas últimas horas." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #ee1515;
      --red-dark: #b30f0f;
      --yellow: #ffcb05;
      --blue: #3b4cca;
      --ink: #12122a;
      --card: #1c1c3d;
      --card-2: #26264f;
      --text: #f4f4ff;
      --muted: #a9a9cf;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Outfit", sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 0%, rgba(59, 76, 202, .45), transparent 45%),
        radial-gradient(circle at 90% 10%, rgba(238, 21, 21, .35), transparent 40%),
        var(--ink);
      background-attachment: fixed;
    }

    header { text-align: center; padding: 56px 20px 28px; }
    .pokeball {
      width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%; position: relative;
      background: linear-gradient(to bottom, var(--red) 0 46%, #222 46% 54%, #fff 54%);
      border: 5px solid #222; box-shadow: 0 8px 30px rgba(238, 21, 21, .5);
      animation: bounce 2.4s ease-in-out infinite;
    }
    .pokeball::after {
      content: ""; position: absolute; inset: 50% auto auto 50%; width: 22px; height: 22px;
      transform: translate(-50%, -50%); border-radius: 50%; background: #fff; border: 5px solid #222;
    }
    @keyframes bounce { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-10px) rotate(12deg); } }
    .group-banner {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin: 18px auto 4px;
      padding: 8px 20px 8px 10px;
      background: var(--card);
      border: 1.5px solid rgba(255, 203, 5, .4);
      border-radius: 999px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .4);
      max-width: 90%;
      text-align: left;
    }
    .group-avatar-wrap {
      position: relative;
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(135deg, var(--yellow), var(--red), var(--blue));
    }
    .group-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: var(--card-2);
    }
    .group-avatar-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 18px;
      height: 18px;
      background: #25d366;
      border: 2px solid #fff;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 10px;
    }
    .group-info-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }
    .group-tag {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--yellow);
      font-weight: 700;
    }
    .group-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 550px;
    }
    @media (max-width: 600px) {
      .group-banner {
        border-radius: 18px;
        padding: 10px 14px;
        max-width: 100%;
      }
      .group-name {
        white-space: normal;
        font-size: 0.95rem;
      }
    }
    h1 {
      font-family: "Press Start 2P", monospace; font-size: clamp(1.2rem, 4.5vw, 2.2rem); line-height: 1.5;
      color: var(--yellow); text-shadow: 3px 3px 0 var(--blue), 6px 6px 0 rgba(0, 0, 0, .35);
    }
    .sub { margin-top: 18px; color: var(--muted); font-size: 1rem; }
    .badge {
      display: inline-block; margin-top: 14px; padding: 6px 16px; border-radius: 999px;
      background: rgba(255, 203, 5, .12); border: 1px solid var(--yellow); color: var(--yellow); font-weight: 600;
    }

    main { max-width: 1100px; margin: 0 auto; padding: 12px 20px 70px; display: grid; gap: 26px; }

    .venda {
      position: relative; border-radius: 20px; padding: 3px; overflow: hidden;
      background: linear-gradient(135deg, var(--yellow), var(--red), var(--blue), var(--yellow));
      background-size: 300% 300%; animation: holo 8s linear infinite;
      transition: transform .25s;
    }
    .venda:hover { transform: translateY(-4px); }
    @keyframes holo { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
    .venda-inner { background: var(--card); border-radius: 17px; padding: 22px; }

    .venda-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .seller { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 1.2rem;
      background: linear-gradient(135deg, var(--red), var(--red-dark)); border: 3px solid #fff; color: #fff;
    }
    .seller-name { font-weight: 700; font-size: 1.15rem; }
    .seller-time { color: var(--muted); font-size: .85rem; }
    .zap {
      text-decoration: none; padding: 10px 18px; border-radius: 12px; font-weight: 700; color: #07230f;
      background: linear-gradient(135deg, #3ddc84, #25b866); transition: transform .15s, box-shadow .15s;
    }
    .zap:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(61, 220, 132, .45); }

    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
    .item { background: var(--card-2); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
    .item img, .item video { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; background: #000; cursor: zoom-in; transition: transform .3s; }
    .item img:hover { transform: scale(1.04); }
    .item p { padding: 10px 12px; font-size: .95rem; white-space: pre-wrap; word-break: break-word; }
    .item.text-only { grid-column: 1 / -1; }
    .item.text-only p { font-size: 1.05rem; padding: 16px; }

    .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 1.1rem; }
    .empty .pokeball { width: 56px; height: 56px; animation-duration: 4s; }

    .controls-bar {
      max-width: 1100px;
      margin: 0 auto 14px;
      padding: 0 20px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }
    .sort-box {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      padding: 6px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .sort-label {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .sort-group {
      display: inline-flex;
      background: var(--card-2);
      padding: 3px;
      border-radius: 10px;
      gap: 4px;
    }
    .sort-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .sort-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.07);
    }
    .sort-btn.active {
      background: linear-gradient(135deg, var(--red), var(--red-dark));
      color: #fff;
      box-shadow: 0 2px 10px rgba(238, 21, 21, 0.4);
    }
    .sort-icon {
      font-weight: 700;
      font-size: 0.95rem;
    }

    @media (max-width: 600px) {
      .controls-bar {
        justify-content: center;
      }
      .sort-box {
        width: 100%;
        justify-content: space-between;
      }
      .sort-group {
        flex: 1;
        justify-content: flex-end;
      }
      .sort-btn {
        flex: 1;
        justify-content: center;
        padding: 8px 10px;
        font-size: 0.8rem;
      }
    }

    #lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, .88); display: none; place-items: center; z-index: 10; cursor: zoom-out; }
    #lightbox.open { display: grid; }
    #lightbox img { max-width: 94vw; max-height: 92vh; border-radius: 12px; }

    footer { text-align: center; padding: 0 20px 40px; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <div class="pokeball" aria-hidden="true"></div>
    <h1>PokéVendas</h1>
    <p class="sub">Cartas anunciadas no grupo — direto do Centro Pokémon</p>

    <div class="group-banner" id="group-banner" style="display: none;">
      <div class="group-avatar-wrap">
        <img id="group-avatar-img" class="group-avatar" alt="Foto do Grupo" />
        <div class="group-avatar-badge" title="Grupo WhatsApp">💬</div>
      </div>
      <div class="group-info-text">
        <span class="group-tag">Grupo no WhatsApp</span>
        <div class="group-name" id="group-name"></div>
      </div>
    </div>

    <div><span class="badge" id="badge">Carregando…</span></div>
  </header>

  <div class="controls-bar">
    <div class="sort-box">
      <span class="sort-label">Ordenar:</span>
      <div class="sort-group" role="group" aria-label="Ordenar anúncios por data">
        <button type="button" class="sort-btn active" id="sort-desc" aria-pressed="true" title="Do mais novo para o mais antigo">
          <span class="sort-icon">↓</span> Mais novos
        </button>
        <button type="button" class="sort-btn" id="sort-asc" aria-pressed="false" title="Do mais antigo para o mais novo">
          <span class="sort-icon">↑</span> Mais antigos
        </button>
      </div>
    </div>
  </div>

  <main id="vendas" aria-live="polite"></main>

  <footer>Atualizada automaticamente pelo robô periodicamente.</footer>

  <div id="lightbox" role="dialog" aria-label="Imagem ampliada"><img alt="" /></div>

  <script>
    const root = document.getElementById("vendas");
    const badge = document.getElementById("badge");
    const lightbox = document.getElementById("lightbox");
    const sortDescBtn = document.getElementById("sort-desc");
    const sortAscBtn = document.getElementById("sort-asc");
    const groupBanner = document.getElementById("group-banner");
    const groupNameEl = document.getElementById("group-name");
    const groupAvatarImg = document.getElementById("group-avatar-img");

    let allVendas = [];
    let currentSort = "desc";

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmt = (iso) => new Date(iso).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });

    // Parâmetros da URL (ex: ?nome=MeuGrupo&foto=https://... ou ?grupo=...&avatar=...)
    const urlParams = new URLSearchParams(window.location.search);
    const paramName = urlParams.get("nome") || urlParams.get("name") || urlParams.get("grupo") || urlParams.get("group");
    const paramPic = urlParams.get("foto") || urlParams.get("pic") || urlParams.get("avatar") || urlParams.get("image") || urlParams.get("img");

    function applyGroupInfo(name, pic) {
      let hasInfo = false;
      if (name && name.trim()) {
        const clean = name.trim();
        groupNameEl.textContent = clean;
        document.title = `${clean} — Cartas à venda`;
        hasInfo = true;
      }
      if (pic && pic.trim()) {
        groupAvatarImg.onload = () => {
          groupAvatarImg.style.display = "block";
        };
        groupAvatarImg.onerror = () => {
          groupAvatarImg.style.display = "none";
        };
        groupAvatarImg.src = pic.trim();
        hasInfo = true;
      } else {
        groupAvatarImg.style.display = "none";
      }
      if (hasInfo) {
        groupBanner.style.display = "inline-flex";
      }
    }

    // Se parâmetros foram passados na URL, aplica imediatamente
    if (paramName || paramPic) {
      applyGroupInfo(paramName, paramPic);
    }

    function getVendaTime(venda) {
      if (!venda.items || venda.items.length === 0) return 0;
      const t = venda.items[0]?.time;
      return t ? new Date(t).getTime() : 0;
    }

    function renderItem(item) {
      if (item.type === "image") return `<div class="item"><img src="${esc(item.media)}" alt="Carta à venda" loading="lazy" />${item.text ? `<p>${esc(item.text)}</p>` : ""}</div>`;
      if (item.type === "video") return `<div class="item"><video src="${esc(item.media)}" controls preload="metadata"></video>${item.text ? `<p>${esc(item.text)}</p>` : ""}</div>`;
      return `<div class="item text-only"><p>${esc(item.text || "(sem texto)")}</p></div>`;
    }

    function renderVenda({ seller, items }) {
      const cleanName = (seller.name || "?").replace(/^@+/, "").trim();
      const initial = esc(cleanName.charAt(0).toUpperCase());
      const zap = seller.phone
        ? `<a class="zap" href="https://wa.me/${esc(seller.phone)}" target="_blank" rel="noopener">💬 Chamar no WhatsApp</a>`
        : "";
      return `
        <article class="venda"><div class="venda-inner">
          <div class="venda-head">
            <div class="seller">
              <div class="avatar">${initial}</div>
              <div><div class="seller-name">${esc(cleanName)}</div><div class="seller-time">${fmt(items[0].time)}</div></div>
            </div>
            ${zap}
          </div>
          <div class="gallery">${items.map(renderItem).join("")}</div>
        </div></article>`;
    }

    function renderVendasList() {
      if (!allVendas.length) {
        root.innerHTML = `<div class="empty"><div class="pokeball" aria-hidden="true"></div>Nenhuma venda por aqui… ainda!</div>`;
        return;
      }
      const sorted = [...allVendas].sort((a, b) => {
        const timeA = getVendaTime(a);
        const timeB = getVendaTime(b);
        return currentSort === "asc" ? timeA - timeB : timeB - timeA;
      });
      root.innerHTML = sorted.map(renderVenda).join("");
    }

    function setSort(order) {
      if (currentSort === order) return;
      currentSort = order;
      sortDescBtn.classList.toggle("active", order === "desc");
      sortDescBtn.setAttribute("aria-pressed", order === "desc" ? "true" : "false");
      sortAscBtn.classList.toggle("active", order === "asc");
      sortAscBtn.setAttribute("aria-pressed", order === "asc" ? "true" : "false");
      renderVendasList();
    }

    sortDescBtn.addEventListener("click", () => setSort("desc"));
    sortAscBtn.addEventListener("click", () => setSort("asc"));

    fetch("vendas.json?t=" + Date.now())
      .then((r) => r.json())
      .then(({ updatedAt, hours, vendas, group, groupName, groupPic }) => {
        // Se não foi definido via URL, aproveita as propriedades do JSON
        const jsonName = group?.name || groupName;
        const jsonPic = group?.pic || groupPic;
        const activeName = paramName || jsonName;
        const activePic = paramPic || jsonPic;
        if (activeName || activePic) {
          applyGroupInfo(activeName, activePic);
        }

        allVendas = vendas || [];
        badge.textContent = updatedAt
          ? `${allVendas.length} venda(s) nas últimas ${hours}h · atualizado ${fmt(updatedAt)}`
          : "Aguardando a primeira atualização";
        renderVendasList();
      })
      .catch(() => {
        badge.textContent = "Erro ao carregar as vendas";
      });

    root.addEventListener("click", (e) => {
      if (e.target.tagName === "IMG" && e.target.closest(".item")) {
        lightbox.querySelector("img").src = e.target.src;
        lightbox.classList.add("open");
      }
    });
    lightbox.addEventListener("click", () => lightbox.classList.remove("open"));
  </script>
</body>
</html>
