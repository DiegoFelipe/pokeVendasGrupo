<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PokéVendas — Cartas à venda nas últimas 24h</title>
  <meta name="description" content="Lista atualizada das vendas de cartas Pokémon anunciadas no grupo nas últimas horas." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #ee1515;
      --red-dark: #b30f0f;
      --yellow: #ffcb05;
      --blue: #3b4cca;
      --ink: #12122a;
      --card: #1c1c3d;
      --card-2: #26264f;
      --text: #f4f4ff;
      --muted: #a9a9cf;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Outfit", sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 0%, rgba(59, 76, 202, .45), transparent 45%),
        radial-gradient(circle at 90% 10%, rgba(238, 21, 21, .35), transparent 40%),
        var(--ink);
      background-attachment: fixed;
    }

    header { text-align: center; padding: 56px 20px 28px; }
    .pokeball {
      width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%; position: relative;
      background: linear-gradient(to bottom, var(--red) 0 46%, #222 46% 54%, #fff 54%);
      border: 5px solid #222; box-shadow: 0 8px 30px rgba(238, 21, 21, .5);
      animation: bounce 2.4s ease-in-out infinite;
    }
    .pokeball::after {
      content: ""; position: absolute; inset: 50% auto auto 50%; width: 22px; height: 22px;
      transform: translate(-50%, -50%); border-radius: 50%; background: #fff; border: 5px solid #222;
    }
    @keyframes bounce { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-10px) rotate(12deg); } }
    #group-avatar-box {
      margin: 0 auto 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .group-avatar-wrap {
      position: relative;
      width: 76px;
      height: 76px;
      margin: 0 auto;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--yellow), var(--red), var(--blue));
      background-size: 200% 200%;
      animation: holo 6s linear infinite;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
    }
    .group-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: var(--card-2);
      border: 3px solid #fff;
    }
    .group-avatar-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 22px;
      height: 22px;
      background: #25d366;
      border: 2px solid #fff;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 11px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .brand-tag {
      font-family: "Press Start 2P", monospace;
      font-size: 0.72rem;
      color: var(--yellow);
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 1.5px 1.5px 0 var(--blue);
      display: inline-block;
      margin-bottom: 8px;
    }
    h1 {
      font-family: "Outfit", sans-serif;
      font-size: clamp(1.3rem, 3.2vw, 2.05rem);
      font-weight: 800;
      line-height: 1.35;
      max-width: 820px;
      margin: 0 auto;
      color: #fff;
      letter-spacing: -0.3px;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.45);
      word-break: break-word;
    }
    .sub { margin-top: 10px; color: var(--muted); font-size: 0.95rem; }
    .badge {
      display: inline-block; margin-top: 14px; padding: 6px 16px; border-radius: 999px;
      background: rgba(255, 203, 5, .12); border: 1px solid var(--yellow); color: var(--yellow); font-weight: 600;
    }

    main { max-width: 1100px; margin: 0 auto; padding: 12px 20px 70px; display: grid; gap: 26px; }

    .venda {
      position: relative; border-radius: 20px; padding: 3px; overflow: hidden;
      background: linear-gradient(135deg, var(--yellow), var(--red), var(--blue), var(--yellow));
      background-size: 300% 300%; animation: holo 8s linear infinite;
      transition: transform .25s;
    }
    .venda:hover { transform: translateY(-4px); }
    @keyframes holo { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }
    .venda-inner { background: var(--card); border-radius: 17px; padding: 22px; }

    .venda-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .seller { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 1.2rem;
      background: linear-gradient(135deg, var(--red), var(--red-dark)); border: 3px solid #fff; color: #fff;
    }
    .seller-name { font-weight: 700; font-size: 1.15rem; }
    .seller-time { color: var(--muted); font-size: .85rem; }
    .zap {
      text-decoration: none; padding: 10px 18px; border-radius: 12px; font-weight: 700; color: #07230f;
      background: linear-gradient(135deg, #3ddc84, #25b866); transition: transform .15s, box-shadow .15s;
    }
    .zap:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(61, 220, 132, .45); }

    .venda-desc {
      background: var(--card-2);
      border-radius: 12px;
      padding: 14px 18px;
      margin-top: 14px;
      border-left: 4px solid var(--yellow);
    }
    .venda-desc p {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .venda-desc p + p {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .venda-desc.text-only {
      margin-top: 0;
      font-size: 1.05rem;
      padding: 16px;
    }

    .gallery-container {
      position: relative;
    }
    .gallery {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      padding: 6px 2px 14px;
      -webkit-overflow-scrolling: touch;
    }
    .gallery.single-item {
      overflow-x: visible;
    }
    .gallery.single-item .item {
      flex: 0 0 240px;
      width: 240px;
    }
    .gallery::-webkit-scrollbar {
      height: 8px;
    }
    .gallery::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 999px;
    }
    .gallery::-webkit-scrollbar-thumb {
      background: linear-gradient(90deg, var(--yellow), var(--red));
      border-radius: 999px;
    }
    .gallery-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(18, 18, 42, 0.9);
      backdrop-filter: blur(8px);
      border: 1.5px solid var(--yellow);
      color: var(--yellow);
      font-size: 1.4rem;
      font-weight: 700;
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 5;
      transition: all .2s ease;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }
    .gallery-arrow:hover {
      background: var(--yellow);
      color: var(--ink);
      transform: translateY(-50%) scale(1.12);
    }
    .gallery-arrow.prev { left: -14px; }
    .gallery-arrow.next { right: -14px; }
    @media (max-width: 768px) {
      .gallery-arrow { display: none; }
    }
    .item {
      flex: 0 0 220px;
      width: 220px;
      background: var(--card-2);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      scroll-snap-align: start;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .item:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }
    .item img, .item video {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      display: block;
      background: #000;
      cursor: zoom-in;
      transition: transform .3s;
    }
    .item img:hover { transform: scale(1.04); }
    .item p {
      padding: 10px 12px;
      font-size: .88rem;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 190px;
      overflow-y: auto;
    }
    .item p::-webkit-scrollbar {
      width: 4px;
    }
    .item p::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }
    .item.text-only {
      flex: 1 1 100%;
      width: 100%;
    }
    .item.text-only p {
      font-size: 1.05rem;
      padding: 16px;
      max-height: none;
    }
    @media (max-width: 600px) {
      .item {
        flex: 0 0 190px;
        width: 190px;
      }
    }

    .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 1.1rem; }
    .empty .pokeball { width: 56px; height: 56px; animation-duration: 4s; }

    .controls-bar {
      max-width: 1100px;
      margin: 0 auto 14px;
      padding: 0 20px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }
    .sort-box {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      padding: 6px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }
    .sort-label {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .sort-group {
      display: inline-flex;
      background: var(--card-2);
      padding: 3px;
      border-radius: 10px;
      gap: 4px;
    }
    .sort-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .sort-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.07);
    }
    .sort-btn.active {
      background: linear-gradient(135deg, var(--red), var(--red-dark));
      color: #fff;
      box-shadow: 0 2px 10px rgba(238, 21, 21, 0.4);
    }
    .sort-icon {
      font-weight: 700;
      font-size: 0.95rem;
    }

    @media (max-width: 600px) {
      .controls-bar {
        justify-content: center;
      }
      .sort-box {
        width: 100%;
        justify-content: space-between;
      }
      .sort-group {
        flex: 1;
        justify-content: flex-end;
      }
      .sort-btn {
        flex: 1;
        justify-content: center;
        padding: 8px 10px;
        font-size: 0.8rem;
      }
    }

    #lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, .88); display: none; place-items: center; z-index: 10; cursor: zoom-out; }
    #lightbox.open { display: grid; }
    #lightbox img { max-width: 94vw; max-height: 92vh; border-radius: 12px; }

    footer { text-align: center; padding: 0 20px 40px; color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <div id="group-avatar-box">
      <div class="pokeball" id="default-pokeball" aria-hidden="true"></div>
      <div class="group-avatar-wrap" id="custom-avatar-wrap" style="display: none;">
        <img id="group-avatar-img" class="group-avatar" alt="Foto do Grupo" />
        <div class="group-avatar-badge" title="Grupo WhatsApp">💬</div>
      </div>
    </div>
    <div class="brand-tag">⚡ PokéVendas</div>
    <h1 id="group-title">PokéVendas</h1>
    <div><span class="badge" id="badge">Carregando…</span></div>
  </header>

  <div class="controls-bar">
    <div class="sort-box">
      <span class="sort-label">Ordenar:</span>
      <div class="sort-group" role="group" aria-label="Ordenar anúncios por data">
        <button type="button" class="sort-btn active" id="sort-desc" aria-pressed="true" title="Do mais novo para o mais antigo">
          <span class="sort-icon">↓</span> Mais novos
        </button>
        <button type="button" class="sort-btn" id="sort-asc" aria-pressed="false" title="Do mais antigo para o mais novo">
          <span class="sort-icon">↑</span> Mais antigos
        </button>
      </div>
    </div>
  </div>

  <main id="vendas" aria-live="polite"></main>

  <footer>Atualizada automaticamente pelo robô periodicamente.</footer>

  <div id="lightbox" role="dialog" aria-label="Imagem ampliada"><img alt="" /></div>

  <script>
    const root = document.getElementById("vendas");
    const badge = document.getElementById("badge");
    const lightbox = document.getElementById("lightbox");
    const sortDescBtn = document.getElementById("sort-desc");
    const sortAscBtn = document.getElementById("sort-asc");
    const groupTitle = document.getElementById("group-title");
    const groupAvatarImg = document.getElementById("group-avatar-img");
    const customAvatarWrap = document.getElementById("custom-avatar-wrap");
    const defaultPokeball = document.getElementById("default-pokeball");

    let allVendas = [];
    let currentSort = "desc";

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const fmt = (iso) => new Date(iso).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });

    // Parâmetros da URL (ex: ?nome=MeuGrupo&foto=https://... ou ?grupo=...&avatar=...)
    const urlParams = new URLSearchParams(window.location.search);
    const paramName = urlParams.get("nome") || urlParams.get("name") || urlParams.get("grupo") || urlParams.get("group");
    const paramPic = urlParams.get("foto") || urlParams.get("pic") || urlParams.get("avatar") || urlParams.get("image") || urlParams.get("img");

    function applyGroupInfo(name, pic) {
      if (name && name.trim()) {
        const clean = name.trim();
        groupTitle.textContent = clean;
        document.title = `${clean} — Cartas à venda`;
      }
      if (pic && pic.trim()) {
        groupAvatarImg.onload = () => {
          customAvatarWrap.style.display = "block";
          defaultPokeball.style.display = "none";
        };
        groupAvatarImg.onerror = () => {
          customAvatarWrap.style.display = "none";
          defaultPokeball.style.display = "block";
        };
        groupAvatarImg.src = pic.trim();
      }
    }

    // Se parâmetros foram passados na URL, aplica imediatamente
    if (paramName || paramPic) {
      applyGroupInfo(paramName, paramPic);
    }

    function getVendaTime(venda) {
      if (!venda.items || venda.items.length === 0) return 0;
      const t = venda.items[0]?.time;
      return t ? new Date(t).getTime() : 0;
    }

    function renderMediaItem(item, showCaption = true) {
      const hasText = showCaption && Boolean(item.text && item.text.trim());
      const captionHtml = hasText ? `<p>${esc(item.text.trim())}</p>` : "";
      if (item.type === "video") {
        return `<div class="item"><video src="${esc(item.media)}" controls preload="metadata"></video>${captionHtml}</div>`;
      }
      return `<div class="item"><img src="${esc(item.media)}" alt="Carta à venda" loading="lazy" />${captionHtml}</div>`;
    }

    function renderVenda({ seller, items }) {
      const cleanName = (seller.name || "?").replace(/^@+/, "").trim();
      const initial = esc(cleanName.charAt(0).toUpperCase());
      const zap = seller.phone
        ? `<a class="zap" href="https://wa.me/${esc(seller.phone)}" target="_blank" rel="noopener">💬 Chamar no WhatsApp</a>`
        : "";

      // Filtra itens de mídia (fotos/vídeos)
      const mediaItems = items.filter((i) => i.type === "image" || i.type === "video");

      // Textos das fotos
      const mediaTexts = mediaItems.map((i) => (i.text || "").trim()).filter(Boolean);
      const uniqueMediaTexts = [...new Set(mediaTexts)];

      // Textos avulsos (mensagens sem foto)
      const standaloneTexts = items
        .filter((i) => i.type === "text")
        .map((i) => (i.text || "").trim())
        .filter(Boolean);

      // Se há mais de 1 foto e TODAS têm exatamente o mesmo texto (ex: lote do WhatsApp):
      // não repete nas fotos, exibe uma única vez abaixo da galeria.
      const isIdenticalSharedText = mediaItems.length > 1 && uniqueMediaTexts.length === 1 && mediaTexts.length === mediaItems.length;

      // Galeria (SEMPRE EM CIMA DO TEXTO)
      let galleryHtml = "";
      if (mediaItems.length > 0) {
        const hasMultiple = mediaItems.length > 2;
        const isSingle = mediaItems.length === 1;
        // Se os textos forem diferentes, exibe a legenda em cada card correspondente
        const showCardCaption = !isIdenticalSharedText;
        galleryHtml = `
          <div class="gallery-container">
            ${hasMultiple ? `<button type="button" class="gallery-arrow prev" aria-label="Rolar para esquerda">‹</button>` : ""}
            <div class="gallery ${isSingle ? "single-item" : ""}">
              ${mediaItems.map((item) => renderMediaItem(item, showCardCaption)).join("")}
            </div>
            ${hasMultiple ? `<button type="button" class="gallery-arrow next" aria-label="Rolar para direita">›</button>` : ""}
          </div>
        `;
      }

      // Bloco de texto inferior:
      // - Se for lote com texto idêntico compartilhado, exibe ele aqui uma única vez
      // - Mensagens avulsas de texto (que não são legendas de fotos)
      const bottomTexts = [];
      if (isIdenticalSharedText && uniqueMediaTexts[0]) {
        bottomTexts.push(uniqueMediaTexts[0]);
      }
      for (const st of standaloneTexts) {
        if (!bottomTexts.includes(st) && (!isIdenticalSharedText || st !== uniqueMediaTexts[0])) {
          bottomTexts.push(st);
        }
      }

      let textHtml = "";
      if (bottomTexts.length > 0) {
        textHtml = `
          <div class="venda-desc ${mediaItems.length === 0 ? "text-only" : ""}">
            ${bottomTexts.map((t) => `<p>${esc(t)}</p>`).join("")}
          </div>
        `;
      }

      return `
        <article class="venda"><div class="venda-inner">
          <div class="venda-head">
            <div class="seller">
              <div class="avatar">${initial}</div>
              <div><div class="seller-name">${esc(cleanName)}</div><div class="seller-time">${fmt(items[0].time)}</div></div>
            </div>
            ${zap}
          </div>
          ${galleryHtml}
          ${textHtml}
        </div></article>`;
    }

    function renderVendasList() {
      if (!allVendas.length) {
        root.innerHTML = `<div class="empty"><div class="pokeball" aria-hidden="true"></div>Nenhuma venda por aqui… ainda!</div>`;
        return;
      }
      const sorted = [...allVendas].sort((a, b) => {
        const timeA = getVendaTime(a);
        const timeB = getVendaTime(b);
        return currentSort === "asc" ? timeA - timeB : timeB - timeA;
      });
      root.innerHTML = sorted.map(renderVenda).join("");
    }

    function setSort(order) {
      if (currentSort === order) return;
      currentSort = order;
      sortDescBtn.classList.toggle("active", order === "desc");
      sortDescBtn.setAttribute("aria-pressed", order === "desc" ? "true" : "false");
      sortAscBtn.classList.toggle("active", order === "asc");
      sortAscBtn.setAttribute("aria-pressed", order === "asc" ? "true" : "false");
      renderVendasList();
    }

    sortDescBtn.addEventListener("click", () => setSort("desc"));
    sortAscBtn.addEventListener("click", () => setSort("asc"));

    fetch("vendas.json?t=" + Date.now())
      .then((r) => r.json())
      .then(({ updatedAt, hours, vendas, group, groupName, groupPic }) => {
        // Se não foi definido via URL, aproveita as propriedades do JSON
        const jsonName = group?.name || groupName;
        const jsonPic = group?.pic || groupPic;
        const activeName = paramName || jsonName;
        const activePic = paramPic || jsonPic;
        if (activeName || activePic) {
          applyGroupInfo(activeName, activePic);
        }

        allVendas = vendas || [];
        badge.textContent = updatedAt
          ? `${allVendas.length} venda(s) nas últimas ${hours}h · atualizado ${fmt(updatedAt)}`
          : "Aguardando a primeira atualização";
        renderVendasList();
      })
      .catch(() => {
        badge.textContent = "Erro ao carregar as vendas";
      });

    root.addEventListener("click", (e) => {
      const arrow = e.target.closest(".gallery-arrow");
      if (arrow) {
        const container = arrow.closest(".gallery-container");
        const gallery = container?.querySelector(".gallery");
        if (gallery) {
          const shift = gallery.clientWidth * 0.75;
          gallery.scrollBy({ left: arrow.classList.contains("prev") ? -shift : shift, behavior: "smooth" });
        }
        return;
      }

      if (e.target.tagName === "IMG" && e.target.closest(".item")) {
        lightbox.querySelector("img").src = e.target.src;
        lightbox.classList.add("open");
      }
    });
    lightbox.addEventListener("click", () => lightbox.classList.remove("open"));

    // Scroll lateral fluido com a roda do mouse
    root.addEventListener("wheel", (e) => {
      const gallery = e.target.closest(".gallery");
      if (!gallery) return;
      if (gallery.scrollWidth > gallery.clientWidth) {
        if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
          gallery.scrollLeft += e.deltaY;
        }
      }
    }, { passive: true });
  </script>
</body>
</html>
